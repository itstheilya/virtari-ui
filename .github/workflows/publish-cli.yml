name: Publish Virtari CLI

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      mode:
        description: Publish mode
        required: true
        type: choice
        default: stage
        options:
          - stage
          - direct

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@latest

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=low

      - name: Verify release contents
        run: pnpm release:cli:check

      - name: Check for an existing release
        id: release
        working-directory: packages/cli
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage package for 2FA approval
        if: steps.release.outputs.exists != 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'stage'
        working-directory: packages/cli
        run: npm stage publish --access public

      - name: Publish package
        if: steps.release.outputs.exists != 'true' && (github.event_name == 'push' || inputs.mode == 'direct')
        working-directory: packages/cli
        run: npm publish --access public

      - name: Record existing release
        if: steps.release.outputs.exists == 'true'
        run: echo "The requested CLI version is already public on npm; no publish was needed." >> "$GITHUB_STEP_SUMMARY"
