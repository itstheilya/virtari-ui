name: Publish Virtari Color Engine

on:
  push:
    tags:
      - "color-engine-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@latest

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm --filter virtari-color-engine typecheck && pnpm --filter virtari-color-engine test && pnpm --filter virtari-color-engine pack --dry-run

      - name: Check for an existing release
        id: release
        working-directory: packages/color-engine
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.release.outputs.exists != 'true'
        working-directory: packages/color-engine
        run: npm publish --access public

      - name: Record existing release
        if: steps.release.outputs.exists == 'true'
        run: echo "The requested Color Engine version is already public on npm; no publish was needed." >> "$GITHUB_STEP_SUMMARY"
