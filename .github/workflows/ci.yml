name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=low

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify license and source comments
        run: pnpm license:check && pnpm comments:check

      - name: Verify AI knowledge snapshot and skills
        run: pnpm ai:check && pnpm ai:test

      - name: Verify MCP transport
        run: pnpm mcp:build && pnpm mcp:test

      - name: Verify source registry and CLI
        run: pnpm registry:check && pnpm registry:test

      - name: Verify documentation
        run: pnpm --filter @virtari-packages/docs exec tsc --noEmit && pnpm --filter @virtari-packages/docs exec vite build
